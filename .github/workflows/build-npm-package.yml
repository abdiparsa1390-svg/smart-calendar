name: Build Smart Calendar npm package

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "vite.config.js"
      - "cli.js"
      - "bin/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/build-npm-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-calendar-npm-package
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install build dependencies
        run: npm install

      - name: Check whether the unscoped npm name is already registered
        run: |
          set +e
          npm view smart-calendar name --json > /tmp/smart-calendar-npm-name.txt 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "The name smart-calendar currently resolves in the npm registry:"
            cat /tmp/smart-calendar-npm-name.txt
            echo "::warning::Check package ownership before trying to publish smart-calendar."
          elif grep -qi "E404" /tmp/smart-calendar-npm-name.txt; then
            echo "No public smart-calendar package was found at check time."
          else
            echo "::warning::Could not conclusively check the npm package name."
            cat /tmp/smart-calendar-npm-name.txt
          fi

      - name: Build and pack the global CLI
        run: |
          node --check cli.js
          node --check bin/smart-calendar.js
          mkdir -p artifacts
          npm pack --pack-destination artifacts
          tar -tzf artifacts/smart-calendar-0.1.0.tgz > artifacts/package-files.txt
          grep -q "package/bin/smart-calendar.js" artifacts/package-files.txt
          grep -q "package/cli.js" artifacts/package-files.txt
          grep -q "package/dist/index.html" artifacts/package-files.txt
          npm install -g ./artifacts/smart-calendar-0.1.0.tgz
          smart-calendar --help
          smart-calendar --version
          smart-calendar --no-open --port 4178 > /tmp/smart-calendar.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4178/api/health > artifacts/health.json; then break; fi
            sleep 1
          done
          grep -q '"ok":true' artifacts/health.json
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - name: Upload installable npm tarball
        uses: actions/upload-artifact@v4
        with:
          name: smart-calendar-npm-package
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
