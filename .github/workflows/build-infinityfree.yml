name: Package Smart Calendar for InfinityFree

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "infinityfree/**"
      - "DEPLOY_INFINITYFREE.md"
      - ".github/workflows/build-infinityfree.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infinityfree-package
  cancel-in-progress: true

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up PHP and required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, mbstring, openssl, pdo_mysql
          coverage: none

      - name: Install frontend dependencies
        run: npm install

      - name: Install PHP dependencies for the uploaded bundle
        run: composer update --working-dir=infinityfree/api --no-dev --prefer-dist --classmap-authoritative --no-interaction --no-progress

      - name: Check PHP syntax
        run: |
          php -l infinityfree/api/index.php
          php -l infinityfree/api/config.example.php

      - name: Build same-origin frontend for InfinityFree
        run: npm run build
        env:
          VITE_DEPLOY_TARGET: infinityfree
          VITE_API_SAME_ORIGIN: "true"
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

      - name: Assemble upload folder
        run: |
          mkdir -p dist/api
          cp -R infinityfree/api/. dist/api/
          cp infinityfree/.htaccess dist/.htaccess
          cp DEPLOY_INFINITYFREE.md dist/README-INFINITYFREE.txt

      - name: Upload InfinityFree-ready ZIP
        uses: actions/upload-artifact@v4
        with:
          name: smart-calendar-infinityfree
          path: dist/
          if-no-files-found: error
          retention-days: 30
